# Railway: in the dashboard set this file as config (e.g. /backend/railway.toml) and
# Root Directory to `backend` for this monorepo.
# https://docs.railway.com/guides/config-as-code

[deploy]
startCommand = "npm start"
healthcheckPath = "/message"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
